<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Treasure Hunt App</title>
</head>
<body>
<style>

    #pageTitle{
        display:block;
        width:700px;
        margin:0px auto;
    }

    body{
        margin:0;
        min-height:100vh;
        background-image: url("background-image.png");
        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;
    }

    #treasureHunts{
        text-align:center;
    }

    #treasureHunts a {
        display:inline-block;
        background-color:#ff9100;
        color: #ffffff;
        font-size:20px;
        font-weight:bold;
        padding:18px 40px;
        margin:15px;
        border:3px solid black;
        border-radius:15px;
        text-decoration:none;
    }

    #treasureHunts a:hover{
        background-color:#e68100;
    }



</style>

<img src="list-teasure-hunts-title.png" id="pageTitle" alt="List of Treasure Hunts">

<div id="treasureHunts">

</div>

<script>
    const treasureHuntsElement = document.getElementById('treasureHunts');
    const LIST_URL = "https://codecyprus.org/th/api/list";
    fetch(LIST_URL)
        .then(response => response.json())
        .then(data => {
            if (data.status === "OK") {
                const treasureHunts = data.treasureHunts;
                for (let i = 0; i < treasureHunts.length; i++) {
                    treasureHuntsElement.innerHTML += `<a href='start.html?uuid=${treasureHunts[i].uuid}&name=${treasureHunts[i].name}'>${treasureHunts[i].name}</a><br>`;
                }
            }
            else{
                alert(data.errorMessage);
            }
        })
</script>
</body>
</html>
