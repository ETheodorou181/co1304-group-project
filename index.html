<html lang="en">
  <head>
    <title>Goose Chase Game</title>

      <style>
          p {
              text-align: center;
              font-size: 70px;
              line-height: 1.0;
              font-weight:1000;
              letter-spacing:-3px;
              font-family:'Arial Rounded MT Bold', Arial, sans-serif;
              color:#ff9100;
          }


          body {
              margin: 0;
              min-height: 100vh;
              background-image:
                      linear-gradient(
                              rgba(0, 0, 0, 0.35),
                              rgba(0, 0, 0, 0.35)
                      ),
                      url("goosechase-banner.png");
              background-size: cover;
              background-position: center;
              background-repeat: no-repeat;
              background-attachment: fixed;
              font-family: Arial, sans-serif;
              color: white;
          }


          .social-widgets {
              position: fixed;
              bottom: 20px;
              right: 20px;
              display: flex;
              flex-direction: column;
              align-items: flex-end;
              gap: 12px;
              z-index: 1000;
          }

          .social-widgets a {
              display: inline-flex;
              align-items: center;
              justify-content: center;
              gap: 8px;
              padding: 12px 20px;
              border-radius: 8px;
              color: white;
              text-decoration: none;
              font-family: Arial, sans-serif;
              font-size: 16px;
              font-weight: bold;
              transition: transform 0.2s, opacity 0.2s;
          }

          .social-widgets a:hover {
              transform: translateY(-3px);
              opacity: 0.85;
          }

          .instagram-btn {
              background: #E4405F;
          }

          .tiktok-btn {
              background: #000000;
              border: 2px solid #25F4EE;
          }

          .twitter-btn {
              background: #000000;
              border: 2px solid #1DA1F2;
          }

          @media (max-width: 600px) {
              .social-widgets {
                  bottom: 12px;
                  right: 12px;
                  gap: 8px;
              }

              .social-widgets a {
                  padding: 10px 14px;
                  font-size: 14px;
              }
          }
      </style>
  </head>

  <body>
    <p>Goose Chase Game</p>

     <div class="social-widgets">
        <a href="https://www.instagram.com/goosechasegame/"
          target="_blank"
          rel="noopener noreferrer"
          class="instagram-btn">
        <img src="https://cdn.simpleicons.org/instagram/E4405F"
          alt=""
          width="20"
          height="20">
        Follow us on Instagram
        </a>
        
       <a href="https://x.com/GooseChaseGame"
           target="_blank"
           rel="noopener noreferrer"
           class="twitter-btn">
        <span class="twitter-icon">𝕏</span>
        Follow us on X
        </a>
        
       <a href="https://www.tiktok.com/@goosechasegame"
         target="_blank"
         rel="noopener noreferrer"
         class="tiktok-btn">
        <span class="tiktok-icon">♪</span>
      Follow us on TikTok 
      </a>
     </div>

  </body>
</html>
