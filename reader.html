<!DOCTYPE html>
<html lang="en">
<head>
    <script src="instascan.min.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta charset="UTF-8">
    <title>QR Code Reader</title>
    <button class="button" onClick="goBack()">Back</button>
    <style>
        .button {
            font-size: 18px;
            padding: 5px 15px;
            cursor: pointer;
            border: none;
            border-radius: 10px;
        }
        #preview {
            width: 100%;
            max-height: 500px;
        }
    </style>
    <style>
        body{
            background-color: #FFF9DB;
        }
    </style>

</head>
<body>

<video id = "preview"></video>

<div class="container" style="text-align: center;">
    <div class="item">
        <button class="button" onClick="nextCamera()">Next</button>
        <button class="button" onClick="startScanner()">Scan QR code</button>
        <button class="button" onClick="copyAnswer()">Copy</button>
    </div>

</div>

<div style="margin: 20px; padding: 20px; background-color: black; color: white; text-align: center; " id="content"></div>


<script>

    let cameraIndex = 0;
    let allCameras = [];
    var scanner = null


    function startScanner() {
        var opts = {

            continuous: true,

            video: document.getElementById('preview'),

            mirror: false,

            captureImage: false,

            backgroundScan: true,

            refractoryPeriod: 5000,

            scanPeriod: 1

        };

        scanner = new Instascan.Scanner(opts);

        Instascan.Camera.getCameras().then(function (cameras) {
            allCameras = cameras;
            if (cameras.length > 0) {
                cameraIndex = 0;
                scanner.start(cameras[cameraIndex]);
            } else {
                console.error('No cameras found.');
                alert("No cameras found.");
            }
        }).catch(function (e) {
            console.error(e);
        });

        scanner.addListener('scan', function (content) {
            console.log(content);
            document.getElementById("content").innerHTML = content;

        });


    }

    function nextCamera() {
        console.log(allCameras);
        if (cameraIndex < allCameras.length - 1) {
            cameraIndex ++;
        }
        else {
            cameraIndex = 0;
        }
        let camera = allCameras[cameraIndex];
        scanner.start(camera);
        console.log(cameraIndex);
    }

    function copyAnswer() {
        const text = document.getElementById("content").innerHTML;
        navigator.clipboard.writeText(text);
    }

    function goBack() {
        window.history.back();
    }

</script>
</body>
</html>
