       let weather = JSON.parse(weatherJSON);

       min = 10000;
       max=0;
       sum = 0;
       for (let i = 0; i < weather.temperatures.length; i++) {
           if (weather.temperatures[i] > max){
               max = weather.temperatures[i]
           }
           if (weather.temperatures[i] < min){
               min = weather.temperatures[i]
           }
           sum+= weather.temperatures[i]
       }
       avg = sum / weather.temperatures.length;
       console.log("Average: " +  avg);
