<!DOCTYPE html>
<html lang="en">
  <head>
      <meta charset="UTF-8">
    <title>Goose Chase Game</title>
      <script src = "Cookies.js" defer ></script>
      <link rel = "stylesheet" href = "cookiesButton.css">
      <script>
      function getLocation(){
        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(showPosition);
        }
        else {
            alert("Geolocation is not supported by your browser.");
        }

      }
      function showPosition(position){
          alert("Latitude: " + position.coords.latitude + ", Longitude" + position.coords.longitude);
          position.coords.latitude
          position.coords.longitude
      }
      getLocation();
      </script>
      <style>
          #gameTitle {
              display: block;
              width: 1000px;
              margin: 20px auto;
          }


          body {
              margin: 0;
              min-height: 100vh;
              background-image:url("goosechase-banner.png");
              background-size: cover;
              background-position: center;
              background-repeat: no-repeat;
              background-attachment: fixed;
              font-family: Arial, sans-serif;
              color: white;
          }


          .social-widgets {
              position: fixed;
              bottom: 20px;
              right: 20px;
              display: flex;
              flex-direction: column;
              align-items: flex-end;
              gap: 12px;
              z-index: 1000;
          }

          .social-widgets a {
              display: inline-flex;
              align-items: center;
              justify-content: center;
              gap: 8px;
              padding: 12px 20px;
              border-radius: 8px;
              color: white;
              text-decoration: none;
              font-family: Arial, sans-serif;
              font-size: 16px;
              font-weight: bold;
              transition: transform 0.2s, opacity 0.2s;
          }

          .social-widgets a:hover {
              transform: translateY(-3px);
              opacity: 0.85;
          }

          .instagram-btn {
              background: #E4405F;
          }

          .tiktok-btn {
              background: #000000;
              border: 2px solid #25F4EE;
          }

          .twitter-btn {
              background: #000000;
              border: 2px solid #1DA1F2;
          }

          @media (max-width: 600px) {
              .social-widgets {
                  bottom: 12px;
                  right: 12px;
                  gap: 8px;
              }

              .social-widgets a {
                  padding: 10px 14px;
                  font-size: 14px;
              }
          }

          .start-btn {
              background-color: #ff9100;
              color: white;
              border: 4px solid white;
              font-size: 28px;
              font-weight: bold;
              padding: 16px;
              border-radius: 16px;
              box-shadow: 2px 2px 4px #b95700;
          }

          .start-btn:hover {

              background-color: #e68100;
          }

      </style>
  </head>

  <body>
    <img src="goosechase-title.png" id="gameTitle" alt="Goose Chase Game">

     <div class="social-widgets">
        <a href="https://www.instagram.com/goosechasegame/"
          target="_blank"
          rel="noopener noreferrer"
          class="instagram-btn">
        <img src="https://cdn.simpleicons.org/instagram/E4405F"
          alt=""
          width="20"
          height="20">
        Follow us on Instagram
        </a>
        
       <a href="https://x.com/GooseChaseGame"
           target="_blank"
           rel="noopener noreferrer"
           class="twitter-btn">
        <span class="twitter-icon">𝕏</span>
        Follow us on X
        </a>
        
       <a href="https://www.tiktok.com/@goosechasegame"
         target="_blank"
         rel="noopener noreferrer"
         class="tiktok-btn">
        <span class="tiktok-icon">♪</span>
      Follow us on TikTok 
      </a>
     </div>

    <div style="text-align: center;">
    <a class="start-btn" href="app.html">START GAME</a>
    </div>

</html>
